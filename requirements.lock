# Festgelegte Paketversionen für Release-Builds (Windows, macOS, Linux x86_64/ARM).
#
# Enthält requirements.txt UND release/requirements-build.txt samt aller
# Unterpakete. Die Release-Skripte (release/scripts/build_*) und der Workflow
# release-build.yml installieren daraus, damit ein Build nicht von heute auf
# morgen andere PyQt6-/WebEngine-Versionen zieht als der zuletzt getestete.
# Für die Entwicklung bleibt requirements.txt (mit >=) maßgeblich.
#
# Plattformabhängige Pakete tragen einen Marker (; sys_platform == ...).
# Nicht von Hand ändern – Aktualisieren: siehe release/README.md, Abschnitt
# „Lock-Datei aktualisieren“. Danach ist ein Testbuild auf allen Plattformen nötig.
