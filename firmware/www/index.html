<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NIT ESP32 MicroPython</title>
<style>
  /* Farbschema folgt der iPad-Einstellung (Hell/Dunkel):
     hell = Eclipse, dunkel = One Dark */
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #000000; --caret: #000000; --sel: rgba(173,214,255,.6);
    --pane-head-bg: #eceff1; --pane-head-fg: #37474f; --border: #cfd8dc;
    --key-bg: #ffffff; --key-fg: #263238; --key-border: #b0bec5;
    --btn2-bg: #b0bec5; --btn2-fg: #263238;
    --con-bg: #ffffff; --con-fg: #1e1e1e; --con-err: #c62828; --con-sys: #00796b;
    --modal-bg: #ffffff; --modal-fg: #263238; --modal-line: #eeeeee;
    --t-kw: #7f0055; --t-str: #2a00ff; --t-com: #3f7f5f; --t-num: #1a1a1a;
    --t-bi: #7f0055; --t-fn: #000000; --t-def: #000000; --t-const: #7f0055; --t-dec: #646464;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #282c34; --fg: #abb2bf; --caret: #528bff; --sel: rgba(62,68,81,.9);
      --pane-head-bg: #21252b; --pane-head-fg: #9da5b4; --border: #181a1f;
      --key-bg: #2c313a; --key-fg: #abb2bf; --key-border: #3e4451;
      --btn2-bg: #3e4451; --btn2-fg: #d7dae0;
      --con-bg: #1e2127; --con-fg: #abb2bf; --con-err: #e06c75; --con-sys: #56b6c2;
      --modal-bg: #282c34; --modal-fg: #d7dae0; --modal-line: #3e4451;
      --t-kw: #c678dd; --t-str: #98c379; --t-com: #5c6370; --t-num: #d19a66;
      --t-bi: #e5c07b; --t-fn: #61afef; --t-def: #61afef; --t-const: #d19a66; --t-dec: #e5c07b;
    }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
               font-family: -apple-system, Segoe UI, Arial, sans-serif; }
  #topbar {
    height: 52px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: #263238; color: #fff; box-sizing: border-box;
  }
  #topbar h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; }
  button, select {
    border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  #btnRun { background: #43a047; color: white; }
  #btnStop { background: #e53935; color: white; }
  #btnSave, #btnProjects { background: #546e7a; color: #fff; }
  #examples { background: #546e7a; color: #fff; max-width: 150px; }
  #board { font-size: 13px; font-weight: 600; color: #80cbc4; padding: 3px 8px;
           border: 1px solid #455a64; border-radius: 5px; }
  #board:empty { display: none; }
  #status { font-size: 13px; color: #cfd8dc; min-width: 130px; }

  /* Hauptbereich: oben Editor, unten Konsole (nebeneinander im Querformat) */
  #main { position: absolute; top: 52px; bottom: 0; left: 0; right: 0; display: flex; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #codepane { flex: 1 1 60%; }
  #consolepane { flex: 1 1 40%; border-left: 2px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    background: var(--pane-head-bg); font-size: 13px; font-weight: 600; color: var(--pane-head-fg);
  }
  .pane-head span { flex: 1; }
  .pane-head button { padding: 4px 10px; font-size: 12px; background: var(--btn2-bg); color: var(--btn2-fg); }
  /* Editor mit Syntax-Highlighting: durchsichtiges Textfeld liegt exakt über
     einer eingefärbten Kopie des Codes (#hl) */
  #editor { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background: var(--bg); }
  #hl, #code {
    position: absolute; inset: 0; margin: 0; box-sizing: border-box; border: 0;
    padding: 8px; font: 16px/1.5 'SF Mono', Menlo, Consolas, monospace;
    letter-spacing: 0; tab-size: 4; white-space: pre; word-wrap: normal;
  }
  #hl { overflow: hidden; pointer-events: none; color: var(--fg); }
  #code {
    width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
    background: transparent; color: transparent; -webkit-text-fill-color: transparent;
    caret-color: var(--caret);
  }
  #code::selection { background: var(--sel); }
  .t-kw { color: var(--t-kw); font-weight: 600; } .t-str { color: var(--t-str); }
  .t-com { color: var(--t-com); font-style: italic; } .t-num { color: var(--t-num); }
  .t-bi { color: var(--t-bi); } .t-fn { color: var(--t-fn); } .t-def { color: var(--t-def); font-weight: 600; }
  .t-const { color: var(--t-const); } .t-dec { color: var(--t-dec); }
  /* Zusatztasten: die iPad-Tastatur hat Tab, Klammern und _ nur versteckt */
  #keys { flex: 0 0 auto; position: relative; z-index: 2; display: flex; gap: 4px; padding: 4px 6px; background: var(--pane-head-bg);
          overflow-x: auto; border-top: 1px solid var(--border); }
  #keys button { padding: 8px 12px; font-size: 16px; min-width: 40px; flex: 0 0 auto;
                 background: var(--key-bg); color: var(--key-fg); border: 1px solid var(--key-border);
                 font-family: 'SF Mono', Consolas, monospace; }
  #console {
    flex: 1; margin: 0; padding: 8px; overflow: auto; background: var(--con-bg);
    color: var(--con-fg); font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
    line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  }
  #console .err { color: var(--con-err); }
  #console .sys { color: var(--con-sys); }

  /* Projekt-Dialog (Speichern/Laden im Browser) */
  #projModal { position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 100; }
  #projModal[hidden] { display: none; }
  .modal-box { background: var(--modal-bg); color: var(--modal-fg); border-radius: 10px; padding: 18px 20px;
    width: min(92%, 440px); max-height: 80%; overflow: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .modal-box h2 { margin: 0 0 4px; font-size: 17px; color: inherit; }
  .modal-hint { margin: 0 0 12px; font-size: 12px; color: #78909c; }
  #projList { list-style: none; margin: 0 0 14px; padding: 0; }
  #projList li { display: flex; align-items: center; gap: 8px; padding: 7px 0;
    border-bottom: 1px solid var(--modal-line); }
  #projList .pname { flex: 1; font-weight: 600; color: inherit; word-break: break-word; }
  #projList button { padding: 5px 10px; font-size: 12px; }
  #projList .load { background: #43a047; color: #fff; }
  #projList .del { background: #ef9a9a; color: #7f1d1d; }
  #projList .empty { color: #90a4ae; font-style: italic; }
  .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-actions button { background: var(--btn2-bg); color: var(--btn2-fg); }

  /* Hochkant (iPad Portrait): untereinander statt nebeneinander */
  @media (max-width: 820px) {
    #main { flex-direction: column; }
    #consolepane { border-left: none; border-top: 2px solid var(--border); }
    #status { display: none; }
  }
</style>
</head>
<body>

<div id="topbar">
  <h1>ESP32 · MicroPython</h1>
  <span id="board"></span>
  <span id="status">Bereit</span>
  <select id="examples" title="Beispielprogramm laden">
    <option value="">Beispiele …</option>
  </select>
  <button id="btnSave">💾 Speichern</button>
  <button id="btnProjects">📂 Projekte</button>
  <button id="btnRun">▶ Ausführen</button>
  <button id="btnStop">■ Stopp</button>
</div>

<div id="main">
  <div id="codepane" class="pane">
    <div class="pane-head"><span>Programm (MicroPython)</span></div>
    <div id="editor">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
                autocorrect="off" aria-label="MicroPython-Code" wrap="off"></textarea>
    </div>
    <div id="keys"></div>
  </div>
  <div id="consolepane" class="pane">
    <div class="pane-head">
      <span>Konsole</span>
      <button id="btnClear">löschen</button>
    </div>
    <pre id="console"></pre>
  </div>
</div>

<div id="projModal" hidden>
  <div class="modal-box">
    <h2>Projekte</h2>
    <p class="modal-hint">Im Browser dieses Geräts gespeichert. „Als Datei sichern“ legt eine .py-Kopie zum Mitnehmen an.</p>
    <ul id="projList"></ul>
    <div class="modal-actions">
      <button id="projExport">⬇ Als Datei sichern</button>
      <button id="projImportBtn">⬆ Datei laden</button>
      <button id="projClose">Schließen</button>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept=".py,.txt" hidden>

<script src="/app.js"></script>
</body>
</html>
